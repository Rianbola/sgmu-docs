<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Документы · Бот расписания СГМУ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17212b);
    --card: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #8b9aa7);
    --accent: var(--tg-theme-button-color, #5288c1);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(127,127,127,.18);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 20px 16px 96px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0 18px; }
  .brand img { width: 36px; height: 36px; border-radius: 9px; }
  .brand span { font-size: 19px; font-weight: 700; }
  .card { background: var(--card); border-radius: 16px; padding: 18px 16px; margin-bottom: 14px; }
  .card h1 { font-size: 21px; margin: 0 0 12px; line-height: 1.25; }
  .item { display: flex; gap: 12px; width: 100%; padding: 12px 6px; border: 0; background: none; color: inherit;
          font: inherit; text-align: left; cursor: pointer; border-radius: 10px; }
  .item:hover { background: var(--line); }
  .item .emoji { font-size: 20px; line-height: 1.3; }
  .item .t { font-weight: 600; display: block; }
  .item .note { display: block; color: var(--hint); font-size: 12.5px; margin-top: 2px; }
  .item.accent { outline: 2px solid var(--accent); outline-offset: -2px; margin-bottom: 6px; }
  .meta { color: var(--hint); font-size: 13px; margin: -6px 0 14px; }
  .label { color: var(--hint); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px; }
  .summary p { margin: 0 0 8px; }
  .summary p:last-child { margin: 0; }
  .toc a { display: block; color: var(--accent); text-decoration: none; padding: 3px 0; font-size: 14px; }
  .body h3 { font-size: 16px; margin: 22px 0 8px; }
  .body h3:first-child { margin-top: 0; }
  .body p { margin: 0 0 10px; }
  .body ul { margin: 0 0 10px; padding-left: 20px; }
  .body blockquote { margin: 0 0 10px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--line); border-radius: 6px; }
  .table { overflow-x: auto; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { color: var(--hint); font-weight: 600; }
  td, th { overflow-wrap: anywhere; }
  .doc.accent .card:first-of-type { outline: 2px solid var(--accent); outline-offset: -2px; }
  .btn { display: block; width: 100%; padding: 13px; border: 0; border-radius: 12px; background: var(--accent);
         color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  .tg .btn { display: none; }
  footer { margin-top: 14px; text-align: center; color: var(--hint); font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>

<script>
const DOCS = [{"id": "schedule-disclaimer", "emoji": "📅", "title": "Об источнике и точности расписания", "menu_title": "Об источнике и точности расписания", "menu_note": "Прочитайте обязательно: расписание в Боте — неофициальное.", "version": "2.0", "date": "08.11.2026", "summary": ["<b>Неофициальный источник.<\/b> Бот не связан с СГМУ. Официальное расписание — только у вуза.", "<b>Откуда данные.<\/b> Из общедоступных файлов на сайте вуза. Они распознаются программой автоматически.", "<b>Возможны ошибки.<\/b> Время, аудитория, неделя или сама пара могут отличаться от реальных.", "<b>Проверяйте важное.<\/b> Перед зачётами, контрольными, первыми парами и после изменений сверяйтесь с вузом.", "<b>Ответственность.<\/b> За пропуск или опоздание на занятия из-за расхождений в расписании Исполнитель не отвечает.", "<b>Нашли ошибку?<\/b> Сообщите в поддержку — исправим."], "toc": [["s1", "1. Бот — неофициальный сервис"], ["s2", "2. Откуда берётся расписание"], ["s3", "3. Почему расписание может отличаться от реального"], ["s4", "4. Что гарантирует и чего не гарантирует Сервис"], ["s5", "5. Обязанность проверять важную информацию"], ["s6", "6. Ответственность"], ["s7", "7. Как сообщить об ошибке"], ["s8", "8. Если источник станет недоступен"], ["s9", "9. Правообладателям и Вузу"]], "body": "<p><i>Редакция 2.0 от 08.11.2026. Документ является неотъемлемой частью Публичной оферты.<\/i><\/p>\n<p>Этот документ объясняет, откуда берётся расписание в Боте «Бот расписания СГМУ», почему в нём возможны ошибки и кто за что отвечает. Пожалуйста, прочитайте его до начала использования Сервиса.<\/p>\n<h3 id=\"s1\">1. Бот — неофициальный сервис<\/h3>\n<p><b>1.1.<\/b> Бот «Бот расписания СГМУ» (далее — «Бот», «Сервис») — самостоятельный информационный сервис. Он <b>не создан, не поддерживается и не одобрен<\/b> ФГБОУ ВО «Саратовский государственный медицинский университет имени В. И. Разумовского» Минздрава России (СГМУ, далее — «Вуз»).<\/p>\n<p><b>1.2.<\/b> Исполнитель не состоит с Вузом в договорных или иных отношениях, не получает от Вуза данные напрямую и не имеет доступа к его внутренним информационным системам.<\/p>\n<p><b>1.3.<\/b> Наименование Вуза упоминается в Сервисе исключительно для указания источника сведений и круга пользователей. Сервис не использует логотипы и иную символику Вуза.<\/p>\n<p><b>1.4.<\/b> <b>Официальным источником расписания является только Вуз<\/b>: его официальный сайт, деканаты, кафедры, преподаватели и иные каналы, которые Вуз определил для информирования обучающихся. При любом расхождении между данными Бота и официальными сведениями Вуза верными считаются сведения Вуза.<\/p>\n<h3 id=\"s2\">2. Откуда берётся расписание<\/h3>\n<p><b>2.1.<\/b> Расписание формируется на основе <b>общедоступных материалов<\/b>, которые Вуз размещает в открытом доступе: официальный сайт Вуза https://sgmu.ru/ (как правило, файлы в формате PDF).<\/p>\n<p><b>2.2.<\/b> Файлы обрабатываются <b>автоматически<\/b> — программой, которая распознаёт таблицы и переводит их в расписание по курсам и группам. Ручная проверка каждой записи не производится.<\/p>\n<p><b>2.3.<\/b> Сервис отражает исходные данные в том виде, в каком они опубликованы Вузом, и в той мере, в какой их удалось корректно распознать.<\/p>\n<h3 id=\"s3\">3. Почему расписание может отличаться от реального<\/h3>\n<p>Пользователь понимает и соглашается, что данные Бота могут не совпадать с фактическим расписанием, в том числе по следующим причинам:<\/p>\n<p><b>3.1. Ошибки в исходных файлах Вуза:<\/b> опечатки, противоречия между датами и количеством дней, неверные номера групп, пропущенные или задублированные строки, отсутствующие аудитории.<\/p>\n<p><b>3.2. Ошибки автоматического распознавания:<\/b> неверно прочитанные объединённые ячейки, сноски и примечания (например, «кроме … групп», «только для … групп»), перепутанные подгруппы, чётные и нечётные недели, смещение строк и столбцов.<\/p>\n<p><b>3.3. Изменения расписания Вузом:<\/b> переносы и отмены пар, изменение аудиторий или корпусов, праздничные и нерабочие дни. Вуз может вносить изменения в любое время, без предупреждения и без обновления опубликованных файлов, а также сообщать о них по другим каналам (через старост, в чатах, устно, на стендах).<\/p>\n<p><b>3.4. Задержка обновления:<\/b> между публикацией изменений Вузом и их появлением в Боте проходит время. Сервис не отслеживает изменения в реальном времени.<\/p>\n<p><b>3.5. Неполнота данных:<\/b> в Боте могут отсутствовать занятия, которые не включены в общедоступные файлы, — например, занятия на клинических базах, практики, консультации, факультативы, индивидуальные графики, зачёты и экзамены, отработки.<\/p>\n<p><b>3.6. Неверные настройки Пользователя:<\/b> выбран не тот курс или группа.<\/p>\n<p><b>3.7. Технические причины:<\/b> сбои оборудования, программного обеспечения, сетей связи или Telegram.<\/p>\n<h3 id=\"s4\">4. Что гарантирует и чего не гарантирует Сервис<\/h3>\n<p><b>4.1. Исполнитель обязуется:<\/b><\/p>\n<ul><li>обеспечивать доступ к функциям Бота в течение оплаченного периода;<\/li><li>прилагать разумные усилия для своевременного обновления данных при появлении новых файлов в источнике;<\/li><li>рассматривать сообщения об ошибках и исправлять подтверждённые ошибки распознавания в разумный срок.<\/li><\/ul>\n<p><b>4.2. Исполнитель не гарантирует:<\/b><\/p>\n<ul><li>полноту, точность и актуальность расписания в каждый момент времени;<\/li><li>совпадение данных Бота с фактическим расписанием, изменениями и решениями Вуза;<\/li><li>своевременную доставку уведомлений и напоминаний.<\/li><\/ul>\n<p><b>4.3.<\/b> Сервис предоставляется <b>«как есть»<\/b>. Предметом услуги является доступ к информационному инструменту, а не обеспечение достоверности сведений Вуза. Расхождение данных Бота с официальным расписанием по причинам из раздела 3 <b>не является недостатком услуги<\/b>, поскольку возможность такого расхождения прямо доведена до Пользователя до заключения Договора.<\/p>\n<h3 id=\"s5\">5. Обязанность проверять важную информацию<\/h3>\n<p><b>5.1.<\/b> Пользователь использует Бот как <b>вспомогательное средство<\/b> и самостоятельно принимает решения о посещении занятий.<\/p>\n<p><b>5.2.<\/b> Пользователь обязуется сверять данные Бота с официальными источниками Вуза, особенно:<\/p>\n<ul><li>в первые дни семестра и после каникул;<\/li><li>перед зачётами, экзаменами, контрольными, коллоквиумами и отработками;<\/li><li>при любых сообщениях об изменениях от Вуза, старост или преподавателей;<\/li><li>если данные в Боте выглядят странно (не указана аудитория, необычное время, «окно» или наложение пар).<\/li><\/ul>\n<p><b>5.3.<\/b> Напоминания и вечерние рассылки формируются на основе тех же данных и не являются самостоятельным подтверждением занятия. Время указывается по часовому поясу Саратов (UTC+4).<\/p>\n<h3 id=\"s6\">6. Ответственность<\/h3>\n<p><b>6.1.<\/b> Исполнитель <b>не несёт ответственности<\/b> за последствия, вызванные причинами из раздела 3, которые находятся вне его контроля и не входят в предмет услуги, в том числе за:<\/p>\n<ul><li>пропуск занятий, опоздание или посещение не того занятия;<\/li><li>пропуски, отмеченные в журнале, необходимость отработок, снижение оценок, недопуск к зачётам и экзаменам, дисциплинарные меры и отчисление;<\/li><li>расходы на проезд и иные расходы, понесённые на основании данных Бота;<\/li><li>любые иные решения, принятые Пользователем на основании данных Бота без сверки с официальными источниками.<\/li><\/ul>\n<p><b>6.2.<\/b> Ответственность Исполнителя определяется законодательством Российской Федерации и Публичной офертой. Ничто в этом документе не ограничивает права Пользователя, которые не могут быть ограничены в силу закона.<\/p>\n<h3 id=\"s7\">7. Как сообщить об ошибке<\/h3>\n<p><b>7.1.<\/b> Если вы заметили ошибку, напишите в «⚙️ Настройки» → «🆘 Написать в поддержку» или на sgmurobot@yandex.ru. Укажите группу, дату, пару и в чём ошибка; по возможности приложите подтверждение (фото, ссылку, сообщение старосты).<\/p>\n<p><b>7.2.<\/b> Исполнитель проверит сообщение и при подтверждении исправит данные для всех пользователей.<\/p>\n<p><b>7.3.<\/b> Исполнитель вправе, но не обязан, начислить бонусные дни Подписки за полезные сообщения об ошибках. Такое начисление является поощрением и не признанием ответственности.<\/p>\n<h3 id=\"s8\">8. Если источник станет недоступен<\/h3>\n<p><b>8.1.<\/b> Если Вуз перестанет публиковать расписание в открытом доступе, ограничит к нему доступ или изменит формат так, что автоматическая обработка станет невозможной, Исполнитель вправе приостановить или прекратить работу Сервиса.<\/p>\n<p><b>8.2.<\/b> В этом случае Исполнитель уведомляет Пользователей через Бот и по выбору Пользователя продлевает Подписку на срок приостановки либо возвращает деньги за неиспользованный период по «Правилам возврата и отказа от услуг».<\/p>\n<h3 id=\"s9\">9. Правообладателям и Вузу<\/h3>\n<p><b>9.1.<\/b> Если вы представляете Вуз или иного правообладателя и считаете, что Сервис нарушает ваши права или законные интересы, напишите на sgmurobot@yandex.ru. Обращение будет рассмотрено в течение 10 рабочих дней.<\/p>"}, {"id": "offer", "emoji": "📜", "title": "Публичная оферта", "menu_title": "Публичная оферта", "menu_note": "", "version": "2.0", "date": "08.11.2026", "summary": ["<b>Что это.<\/b> «Бот расписания СГМУ» показывает расписание на день и неделю, присылает расписание на завтра и напоминает о парах.", "<b>Не официальный сервис.<\/b> Бот не связан с СГМУ. Расписание берётся из открытых файлов вуза и может содержать ошибки — важное проверяйте в вузе.", "<b>Доступ.<\/b> Новым пользователям — 7 дней бесплатно, дальше — платная подписка.", "<b>Автоплатёж.<\/b> Включается только вами и отключается в любой момент в «💳 Подписка». Перед списанием предупредим.", "<b>Возвраты.<\/b> Деньги за неиспользованные дни можно вернуть.", "<b>Помощь.<\/b> «🆘 Написать в поддержку» или sgmurobot@yandex.ru."], "toc": [["s1", "о заключении договора оказания услуг"], ["s2", "1. Термины"], ["s3", "2. Общие положения"], ["s4", "3. Предмет Договора"], ["s5", "4. Источник и характер данных"], ["s6", "5. Пробный период, тарифы, промокоды, рефералы"], ["s7", "6. Автоплатёж"], ["s8", "7. Оплата и чеки"], ["s9", "8. Срок Подписки"], ["s10", "9. Права и обязанности сторон"], ["s11", "10. Доступность Сервиса"], ["s12", "11. Ответственность"], ["s13", "12. Отказ от Договора и прекращение"], ["s14", "13. Интеллектуальные права"], ["s15", "14. Персональные данные"], ["s16", "15. Уведомления"], ["s17", "16. Изменение Оферты"], ["s18", "17. Споры"], ["s19", "18. Реквизиты Исполнителя"]], "body": "<h3 id=\"s1\">о заключении договора оказания услуг<\/h3>\n<p><i>Редакция 2.0 от 08.11.2026. Актуальная редакция: https://rianbola.github.io/sgmu-docs/ и в Боте по команде /docs.<\/i><\/p>\n<h3 id=\"s2\">1. Термины<\/h3>\n<p><b>1.1.<\/b> В Оферте используются следующие термины:<\/p>\n<ul><li><b>Исполнитель<\/b> — Баталин Ярослав Леонидович, физическое лицо, применяющее специальный налоговый режим «Налог на профессиональный доход» (НПД), ИНН 583408943837.<\/li><li><b>Пользователь<\/b> — физическое лицо, использующее Сервис через Telegram.<\/li><li><b>Бот<\/b> — Telegram-бот «Бот расписания СГМУ» (@SgmuRoBot).<\/li><li><b>Мини-приложение<\/b> — веб-интерфейс Бота, открываемый внутри Telegram.<\/li><li><b>Сервис<\/b> — Бот и Мини-приложение вместе.<\/li><li><b>Вуз<\/b> — ФГБОУ ВО «Саратовский государственный медицинский университет имени В. И. Разумовского» Минздрава России (СГМУ).<\/li><li><b>Исходные данные<\/b> — общедоступные материалы с расписанием, опубликованные Вузом.<\/li><li><b>Официальное расписание<\/b> — расписание, утверждённое и доведённое Вузом до обучающихся по его официальным каналам.<\/li><li><b>Подписка<\/b> — оплаченное право доступа к функциям Сервиса на определённый срок.<\/li><li><b>Пробный период<\/b> — бесплатный доступ к функциям Сервиса для нового Пользователя.<\/li><li><b>Автоплатёж<\/b> — автоматическое списание оплаты за следующий период Подписки с сохранённого способа оплаты.<\/li><\/ul>\n<h3 id=\"s3\">2. Общие положения<\/h3>\n<p><b>2.1.<\/b> Настоящий документ является публичной офертой (ст. 437 ГК РФ) Исполнителя о заключении договора возмездного оказания услуг (далее — «Договор») на изложенных условиях.<\/p>\n<p><b>2.2.<\/b> Неотъемлемыми частями Оферты являются:<\/p>\n<ul><li>«Об источнике и точности расписания»;<\/li><li>«Правила допустимого использования»;<\/li><li>«Правила возврата и отказа от услуг».<\/li><\/ul>\n<p><b>2.3.<\/b> <b>Акцептом<\/b> Оферты является нажатие кнопки «✅ Согласен, погнали!» в интерфейсе Бота (п. 3 ст. 438 ГК РФ). Оплата Подписки или активация промокода также является акцептом. С момента акцепта Договор считается заключённым в электронной форме.<\/p>\n<p><b>2.4.<\/b> Акцепт означает, что Пользователь до заключения Договора ознакомился с Офертой и всеми её частями, в том числе с документом «Об источнике и точности расписания», понимает, что расписание в Сервисе <b>неофициальное и может содержать ошибки<\/b>, и принимает условия полностью и без оговорок.<\/p>\n<p><b>2.5.<\/b> «Политика в отношении обработки персональных данных» не является частью Оферты. Акцепт Оферты <b>не является согласием на обработку персональных данных<\/b>. Если для какой-либо операции требуется согласие, оно запрашивается отдельно (ст. 9 Федерального закона № 152-ФЗ «О персональных данных»).<\/p>\n<p><b>2.6.<\/b> Принимая Оферту, Пользователь подтверждает, что ему исполнилось 14 лет. Пользователь в возрасте от 14 до 18 лет подтверждает, что оплачивает Подписку за счёт собственных средств (стипендии, заработка) либо с согласия законного представителя (ст. 26 ГК РФ).<\/p>\n<h3 id=\"s4\">3. Предмет Договора<\/h3>\n<p><b>3.1.<\/b> Исполнитель предоставляет Пользователю доступ к функциям Сервиса, а Пользователь оплачивает Подписку (по окончании Пробного периода).<\/p>\n<p><b>3.2.<\/b> В функции Сервиса входят:<\/p>\n<ul><li>просмотр расписания на день и на неделю (текущая и следующая недели);<\/li><li>вечерняя рассылка расписания на следующий день;<\/li><li>напоминания о начале пары за выбранное время;<\/li><li>расписание сессии (экзамены и зачёты), если оно добавлено для группы;<\/li><li>расписание картинкой;<\/li><li>выбор курса, группы и настройка уведомлений.<\/li><\/ul>\n<p><b>3.3.<\/b> Услуги оказываются дистанционно, в электронной форме, без передачи материальных носителей.<\/p>\n<p><b>3.4.<\/b> <b>В предмет Договора не входят:<\/b><\/p>\n<ul><li>предоставление официального расписания или иных официальных сведений Вуза;<\/li><li>гарантия полноты, точности и актуальности расписания;<\/li><li>взаимодействие с Вузом от имени Пользователя;<\/li><li>контроль посещаемости, учёт пропусков и отработок.<\/li><\/ul>\n<p><b>3.5.<\/b> Надлежащим оказанием услуг считается обеспечение доступа к функциям Сервиса в течение оплаченного периода. Расхождение отдельных сведений с Официальным расписанием по причинам, указанным в документе «Об источнике и точности расписания», <b>не является недостатком услуги<\/b>: эта особенность Сервиса доведена до Пользователя до заключения Договора (ст. 10 Закона РФ «О защите прав потребителей»).<\/p>\n<h3 id=\"s5\">4. Источник и характер данных<\/h3>\n<p><b>4.1.<\/b> Расписание формируется путём автоматической обработки Исходных данных, опубликованных Вузом в открытом доступе (официальный сайт Вуза https://sgmu.ru/).<\/p>\n<p><b>4.2.<\/b> Исходные данные могут содержать ошибки; при распознавании возможны искажения; Вуз может изменить расписание в любое время без обновления опубликованных файлов. Подробно — в документе «Об источнике и точности расписания».<\/p>\n<p><b>4.3.<\/b> Сервис является <b>вспомогательным справочным инструментом<\/b>. При расхождении данных Сервиса и Официального расписания верным считается Официальное расписание.<\/p>\n<h3 id=\"s6\">5. Пробный период, тарифы, промокоды, рефералы<\/h3>\n<p><b>5.1.<\/b> Каждому новому Пользователю однократно предоставляется бесплатный Пробный период — <b>7 календарных дней<\/b> с момента акцепта. Повторное получение Пробного периода, в том числе с других аккаунтов, не допускается.<\/p>\n<p><b>5.2.<\/b> По окончании Пробного периода доступ к функциям прекращается, если Пользователь не оформил Подписку. <b>Автоматического списания по окончании Пробного периода не происходит.<\/b><\/p>\n<p><b>5.3.<\/b> Подписка оформляется на 1, 3, 6 или 12 месяцев. Стоимость указывается в интерфейсе Сервиса перед оплатой и подтверждается чеком. Изменение тарифов не влияет на уже оплаченный период.<\/p>\n<p><b>5.4.<\/b> Промокоды могут предоставлять дополнительные дни Подписки. Условия промокода показываются при активации. Дни по разным промокодам суммируются и добавляются к текущему сроку Подписки; каждый промокод один Пользователь может активировать только один раз. Промокоды не обмениваются на деньги.<\/p>\n<p><b>5.5.<\/b> За каждого нового Пользователя, начавшего пользоваться Ботом по персональной реферальной ссылке, пригласившему начисляются дополнительные дни Подписки. Условия программы отображаются в Боте и могут изменяться без влияния на уже начисленные дни. Начисление за фиктивных пользователей и собственные дополнительные аккаунты не производится.<\/p>\n<h3 id=\"s7\">6. Автоплатёж<\/h3>\n<p><b>6.1.<\/b> Автоплатёж подключается <b>только по явному действию Пользователя<\/b> — отдельной отметкой при оплате или кнопкой «🔁 Автоплатёж» в разделе «💳 Подписка». Без такого действия способ оплаты не сохраняется и повторные списания не производятся.<\/p>\n<p><b>6.2.<\/b> До подключения Автоплатежа Пользователю сообщаются сумма, периодичность списаний и способ отключения.<\/p>\n<p><b>6.3.<\/b> Не позднее чем за <b>3 дня<\/b> до списания Исполнитель направляет в Бот уведомление с датой и суммой списания.<\/p>\n<p><b>6.4.<\/b> Пользователь может в любой момент отключить Автоплатёж и удалить сохранённый способ оплаты в разделе «💳 Подписка». Отключение прекращает будущие списания; оплаченный период действует до даты окончания.<\/p>\n<p><b>6.5.<\/b> Если списание не прошло, Исполнитель вправе повторить попытку в течение 3 дней. При неудаче Автоплатёж отключается, о чём Пользователь получает уведомление.<\/p>\n<p><b>6.6.<\/b> Если списание по Автоплатежу произошло, а Пользователь не хотел продлевать Подписку, он вправе запросить возврат по «Правилам возврата и отказа от услуг».<\/p>\n<h3 id=\"s8\">7. Оплата и чеки<\/h3>\n<p><b>7.1.<\/b> Оплата производится безналичным способом через платёжный сервис ЮKassa (ООО НКО «ЮМани»). Доступные способы оплаты отображаются на платёжной странице.<\/p>\n<p><b>7.2.<\/b> Данные банковской карты вводятся на стороне ЮKassa. Исполнитель не получает и не хранит полный номер карты и CVC/CVV-код.<\/p>\n<p><b>7.3.<\/b> Чек формируется в приложении «Мой налог» в электронной форме в момент оплаты в соответствии с Федеральным законом № 422-ФЗ и направляется Пользователю ссылкой в Боте (в чате Telegram, из которого производилась оплата). По запросу Пользователя чек дополнительно направляется на указанный им e-mail. Исполнитель применяет НПД, <b>НДС не облагается<\/b>.<\/p>\n<p><b>7.4.<\/b> Обязательство по оплате считается исполненным с момента поступления подтверждения об успешном платеже от ЮKassa.<\/p>\n<h3 id=\"s9\">8. Срок Подписки<\/h3>\n<p><b>8.1.<\/b> Подписка начинает действовать с момента подтверждения оплаты или активации промокода, если в интерфейсе не указано иное.<\/p>\n<p><b>8.2.<\/b> Если Подписка оплачена при действующей Подписке, новый период начинается после окончания текущего.<\/p>\n<p><b>8.3.<\/b> Неиспользование Сервиса по причинам, зависящим от Пользователя (нет доступа к интернету или Telegram, отключены уведомления, выбрана не та группа и т. п.), не является основанием для продления срока.<\/p>\n<h3 id=\"s10\">9. Права и обязанности сторон<\/h3>\n<p><b>9.1. Исполнитель обязуется:<\/b><\/p>\n<ul><li>предоставлять доступ к функциям Сервиса в течение Пробного периода и оплаченной Подписки;<\/li><li>прилагать разумные усилия для своевременного обновления расписания и исправления подтверждённых ошибок;<\/li><li>рассматривать обращения Пользователей в сроки, указанные в документах Сервиса;<\/li><li>обрабатывать персональные данные в соответствии с законом и Политикой.<\/li><\/ul>\n<p><b>9.2. Исполнитель вправе:<\/b><\/p>\n<ul><li>проводить технические работы, по возможности предупреждая о них заранее;<\/li><li>изменять интерфейс и функции Сервиса, не ухудшая основных функций из п. 3.2 в течение оплаченного периода;<\/li><li>ограничивать доступ при нарушении «Правил допустимого использования»;<\/li><li>устанавливать технические лимиты, необходимые для стабильной работы.<\/li><\/ul>\n<p><b>9.3. Пользователь обязуется:<\/b><\/p>\n<ul><li>правильно выбрать курс и группу и своевременно изменять их при переводе;<\/li><li>самостоятельно сверять важные сведения с Официальным расписанием (раздел 5 документа «Об источнике и точности расписания»);<\/li><li>обеспечивать безопасность своего Telegram-аккаунта;<\/li><li>соблюдать «Правила допустимого использования».<\/li><\/ul>\n<p><b>9.4. Пользователь вправе:<\/b><\/p>\n<ul><li>пользоваться функциями Сервиса в течение Пробного периода и оплаченной Подписки;<\/li><li>сообщать об ошибках в расписании;<\/li><li>в любой момент отказаться от Договора с возвратом денег за неиспользованный период.<\/li><\/ul>\n<h3 id=\"s11\">10. Доступность Сервиса<\/h3>\n<p><b>10.1.<\/b> Исполнитель стремится к бесперебойной работе Сервиса, но не гарантирует его постоянную доступность.<\/p>\n<p><b>10.2.<\/b> Работа Сервиса зависит от Telegram, сетей связи, хостинг-провайдера, ЮKassa, доступности Исходных данных и устройства Пользователя. Ограничение доступа к Telegram или к сайту Вуза, в том числе по решениям государственных органов, не является нарушением Договора со стороны Исполнителя.<\/p>\n<p><b>10.3.<\/b> Если Сервис был полностью недоступен по вине Исполнителя более <b>3 суток подряд<\/b>, Исполнитель продлевает действующие Подписки на срок недоступности.<\/p>\n<h3 id=\"s12\">11. Ответственность<\/h3>\n<p><b>11.1.<\/b> Стороны несут ответственность в соответствии с законодательством Российской Федерации.<\/p>\n<p><b>11.2.<\/b> Исполнитель не несёт ответственности за последствия, вызванные обстоятельствами вне его контроля, которые не входят в предмет Договора, в том числе:<\/p>\n<ul><li>ошибками и неполнотой Исходных данных, изменениями расписания Вузом и задержками их отражения в Сервисе;<\/li><li>пропуском или опозданием на занятия, их последствиями в учёбе и расходами Пользователя, если они вызваны расхождением данных Сервиса с Официальным расписанием;<\/li><li>неверным выбором группы, отключёнными уведомлениями и иными действиями или бездействием Пользователя;<\/li><li>непроверкой Пользователем важных сведений по официальным источникам Вуза;<\/li><li>перебоями в работе Telegram, сетей связи, ЮKassa, устройств Пользователя;<\/li><li>обстоятельствами непреодолимой силы.<\/li><\/ul>\n<p><b>11.3.<\/b> Ничто в Оферте не ограничивает права Пользователя как потребителя, которые не могут быть ограничены в силу Закона РФ «О защите прав потребителей».<\/p>\n<h3 id=\"s13\">12. Отказ от Договора и прекращение<\/h3>\n<p><b>12.1.<\/b> Пользователь вправе в любой момент отказаться от Договора, написав в поддержку. Возврат — по «Правилам возврата и отказа от услуг».<\/p>\n<p><b>12.2.<\/b> Исполнитель вправе в одностороннем порядке отказаться от Договора при грубом или повторном нарушении «Правил допустимого использования». Расчёт — по «Правилам возврата и отказа от услуг».<\/p>\n<p><b>12.3.<\/b> Исполнитель вправе прекратить работу Сервиса полностью, уведомив Пользователей через Бот не менее чем за <b>14 календарных дней<\/b> (кроме случаев из раздела 8 документа «Об источнике и точности расписания»). Деньги за неиспользованные дни возвращаются.<\/p>\n<h3 id=\"s14\">13. Интеллектуальные права<\/h3>\n<p><b>13.1.<\/b> Исключительные права на программный код, дизайн, тексты и структуру базы данных Сервиса принадлежат Исполнителю.<\/p>\n<p><b>13.2.<\/b> Пользователю предоставляется неисключительное право использовать Сервис для личных некоммерческих целей в пределах своего аккаунта и срока доступа. Запрещены декомпиляция, копирование базы данных, автоматическое извлечение данных и коммерческое распространение.<\/p>\n<p><b>13.3.<\/b> Пользователь может делиться расписанием своей группы с одногруппниками в личных целях (например, скриншотом).<\/p>\n<h3 id=\"s15\">14. Персональные данные<\/h3>\n<p><b>14.1.<\/b> Персональные данные обрабатываются в соответствии с Федеральным законом № 152-ФЗ и «Политикой в отношении обработки персональных данных», доступной по команде /docs и по адресу https://rianbola.github.io/sgmu-docs/.<\/p>\n<h3 id=\"s16\">15. Уведомления<\/h3>\n<p><b>15.1.<\/b> Юридически значимые сообщения Исполнителя направляются через Бот и/или публикуются в разделе документов. Сообщения Пользователя направляются через поддержку в Боте или на sgmurobot@yandex.ru.<\/p>\n<p><b>15.2.<\/b> Служебные уведомления (о Подписке, списаниях, изменениях документов, технических работах) не являются рекламой. Рекламные сообщения направляются только при наличии отдельного согласия Пользователя.<\/p>\n<h3 id=\"s17\">16. Изменение Оферты<\/h3>\n<p><b>16.1.<\/b> Исполнитель вправе изменять Оферту. Новая редакция публикуется с указанием даты вступления в силу.<\/p>\n<p><b>16.2.<\/b> О существенных изменениях Пользователи уведомляются через Бот не менее чем за <b>7 календарных дней<\/b> до вступления их в силу.<\/p>\n<p><b>16.3.<\/b> Изменения, ухудшающие положение Пользователя, применяются к действующей Подписке только со следующего оплаченного периода. Если Пользователь не согласен с изменениями, он вправе отказаться от Договора с возвратом за неиспользованный период.<\/p>\n<h3 id=\"s18\">17. Споры<\/h3>\n<p><b>17.1.<\/b> Пользователь <b>вправе<\/b> до обращения в суд направить претензию через поддержку или на sgmurobot@yandex.ru. Срок ответа — до 10 календарных дней.<\/p>\n<p><b>17.2.<\/b> К Договору применяется право Российской Федерации. Пользователь-потребитель вправе обратиться в суд по месту своего жительства, месту пребывания, месту заключения или исполнения Договора либо по месту жительства Исполнителя (ст. 17 Закона РФ «О защите прав потребителей»).<\/p>\n<h3 id=\"s19\">18. Реквизиты Исполнителя<\/h3>\n<ul><li><b>Исполнитель:<\/b> Баталин Ярослав Леонидович<\/li><li><b>Статус:<\/b> физическое лицо, применяющее НПД (самозанятый); НДС не облагается<\/li><li><b>ИНН:<\/b> 583408943837<\/li><li><b>Город:<\/b> Санкт-Петербург<\/li><li><b>E-mail:<\/b> sgmurobot@yandex.ru<\/li><li><b>Поддержка:<\/b> «⚙️ Настройки» → «🆘 Написать в поддержку»<\/li><\/ul>"}, {"id": "privacy-policy", "emoji": "🔒", "title": "Политика в отношении обработки персональных данных", "menu_title": "Политика обработки ПД", "menu_note": "", "version": "2.0", "date": "08.11.2026", "summary": ["<b>Зачем данные.<\/b> Чтобы бот работал: показывал расписание, присылал напоминания, обрабатывал подписку и платежи.", "<b>Что собираем.<\/b> Telegram ID, имя и username, курс и группу, настройки, служебные журналы, данные о платежах — без номера карты и CVC/CVV.", "<b>Где храним.<\/b> На серверах в России. Резервные копии хранятся не дольше 30 дней.", "<b>Кому передаём.<\/b> ЮKassa — для оплаты, Telegram — для доставки сообщений, госорганам — когда требует закон. Не продаём и не передаём для рекламы.", "<b>Ваши права.<\/b> Узнать, исправить или удалить данные — напишите в поддержку или на sgmurobot@yandex.ru.", "<b>Возраст.<\/b> Сервис рассчитан на пользователей от 14 лет."], "toc": [["s1", "1. Общие положения"], ["s2", "2. Оператор"], ["s3", "3. Какие данные обрабатываются"], ["s4", "4. Цели и правовые основания"], ["s5", "5. Действия с данными"], ["s6", "6. Источники данных"], ["s7", "7. Мини-приложение, cookie и аналитика"], ["s8", "8. Место и сроки хранения"], ["s9", "9. Передача данных"], ["s10", "10. Трансграничная передача через Telegram"], ["s11", "11. Права Пользователя"], ["s12", "12. Защита данных"], ["s13", "13. Несовершеннолетние"], ["s14", "14. Изменение Политики"], ["s15", "15. Связанные документы"]], "body": "<p><i>Редакция 2.0 от 08.11.2026. Актуальная редакция: https://rianbola.github.io/sgmu-docs/ и в Боте по команде /docs.<\/i><\/p>\n<h3 id=\"s1\">1. Общие положения<\/h3>\n<p><b>1.1.<\/b> Политика определяет цели, состав, основания и порядок обработки персональных данных пользователей Telegram-бота «Бот расписания СГМУ», его Мини-приложения и службы поддержки (далее — «Сервис»), а также меры по их защите.<\/p>\n<p><b>1.2.<\/b> Политика разработана в соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных» (далее — «152-ФЗ») в действующей редакции и принятыми в соответствии с ним актами. Политика является общедоступной (ч. 2 ст. 18.1 152-ФЗ).<\/p>\n<p><b>1.3.<\/b> Оператор обрабатывает только те данные, которые необходимы для заранее определённых целей, и не допускает обработки, несовместимой с ними.<\/p>\n<h3 id=\"s2\">2. Оператор<\/h3>\n<ul><li><b>Оператор:<\/b> Баталин Ярослав Леонидович, физическое лицо, применяющее НПД<\/li><li><b>ИНН:<\/b> 583408943837<\/li><li><b>Место нахождения:<\/b> Санкт-Петербург, Российская Федерация<\/li><li><b>E-mail по вопросам персональных данных:<\/b> sgmurobot@yandex.ru<\/li><li><b>Поддержка в Боте:<\/b> «⚙️ Настройки» → «🆘 Написать в поддержку»<\/li><\/ul>\n<h3 id=\"s3\">3. Какие данные обрабатываются<\/h3>\n<p><b>3.1. Данные для работы Сервиса:<\/b><\/p>\n<ul><li>Telegram ID, username, отображаемое имя, имя и фамилия из профиля Telegram, язык интерфейса;<\/li><li>выбранные курс и группа;<\/li><li>команды и сообщения, направленные Боту;<\/li><li>содержание и идентификаторы сообщений и уведомлений Бота;<\/li><li>настройки уведомлений, расписания и Подписки;<\/li><li>дата, время и версия принятых документов и предоставленных согласий, в том числе согласия на рекламные сообщения и его отзыва;<\/li><li>реферальные связи (кто кого пригласил) и активированные промокоды.<\/li><\/ul>\n<p><b>3.2. Технические данные:<\/b><\/p>\n<ul><li>дата и время действий, состояние диалога, сведения об ошибках, технические журналы;<\/li><li>при открытии Мини-приложения: IP-адрес, сведения о браузере и устройстве (user agent), данные запуска, которые Telegram передаёт Мини-приложению (initData: Telegram ID, имя, username, язык, подпись запроса).<\/li><\/ul>\n<p><b>3.3. Данные, связанные с оплатой:<\/b><\/p>\n<ul><li>идентификаторы Пользователя, заказа и платежа, сумма, валюта, дата и статус платежа;<\/li><li>тариф, период Подписки, промокод, сведения о возврате, ссылка на чек;<\/li><li>e-mail или телефон, если Пользователь указал их для получения чека и они переданы Оператору платёжным сервисом;<\/li><li>идентификатор сохранённого способа оплаты, его тип и последние 4 цифры карты;<\/li><li>технические ответы ЮKassa и сведения об ошибках платежей.<\/li><\/ul>\n<p><b>Оператор не получает и не хранит полный номер банковской карты и CVC/CVV-код<\/b> — их обрабатывает ЮKassa.<\/p>\n<p><b>3.4. Данные обращений в поддержку:<\/b> Telegram ID, контактные данные, содержание обращения, приложенные файлы и связанные с обращением сведения.<\/p>\n<p><b>3.5.<\/b> Оператор не запрашивает специальные категории персональных данных (о здоровье, убеждениях и т. п.) и биометрические данные. Пожалуйста, не отправляйте такие данные в сообщениях и файлах. Если они всё же получены, Оператор удаляет их, кроме случаев, когда хранение требуется по закону.<\/p>\n<h3 id=\"s4\">4. Цели и правовые основания<\/h3>\n<div class=\"table\"><table><thead><tr><th>Цель<\/th><th>Данные<\/th><th>Основание<\/th><\/tr><\/thead><tbody><tr><td>Работа Бота и Мини-приложения: идентификация, показ расписания, уведомления, настройки<\/td><td>п. 3.1, 3.2<\/td><td>Исполнение договора (п. 5 ч. 1 ст. 6 152-ФЗ)<\/td><\/tr><tr><td>Подписка: Пробный период, промокоды, реферальная программа, автопродление<\/td><td>п. 3.1, 3.3<\/td><td>Исполнение договора<\/td><\/tr><tr><td>Расчёты, чеки, возвраты<\/td><td>п. 3.3<\/td><td>Исполнение договора; требования налогового законодательства (п. 2 ч. 1 ст. 6 152-ФЗ)<\/td><\/tr><tr><td>Сохранение способа оплаты для Автоплатежа<\/td><td>п. 3.3<\/td><td>Исполнение договора по явному выбору Пользователя<\/td><\/tr><tr><td>Поддержка, рассмотрение претензий и споров<\/td><td>п. 3.4<\/td><td>Исполнение договора; требования закона; законный интерес Оператора (п. 7 ч. 1 ст. 6 152-ФЗ)<\/td><\/tr><tr><td>Безопасность, предотвращение злоупотреблений, диагностика ошибок<\/td><td>п. 3.1, 3.2<\/td><td>Исполнение договора; законный интерес Оператора<\/td><\/tr><tr><td>Доставка сообщений через Telegram<\/td><td>п. 3.1<\/td><td>Исполнение договора<\/td><\/tr><tr><td>Подтверждение акцепта документов<\/td><td>п. 3.1<\/td><td>Исполнение договора; законный интерес Оператора<\/td><\/tr><tr><td>Рекламные сообщения через Бот — только если Пользователь отдельно согласился<\/td><td>Telegram ID, сведения о согласии<\/td><td>Согласие (п. 1 ч. 1 ст. 6 152-ФЗ; ч. 1 ст. 18 Федерального закона «О рекламе»)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>4.2.<\/b> Обработка по указанным целям <b>не требует отдельного согласия<\/b>. Если для какой-либо операции согласие потребуется (например, для рекламных рассылок), оно будет запрошено отдельно, конкретно и информированно, отдельно от Оферты и иных документов (ст. 9 152-ФЗ). Отказ от такого согласия не влияет на работу основных функций.<\/p>\n<p><b>4.3.<\/b> Оператор <b>не продаёт<\/b> персональные данные и не передаёт их третьим лицам для рекламы.<\/p>\n<h3 id=\"s5\">5. Действия с данными<\/h3>\n<p><b>5.1.<\/b> Оператор осуществляет сбор, запись, систематизацию, накопление, хранение, уточнение, извлечение, использование, передачу (предоставление, доступ), обезличивание, блокирование, удаление и уничтожение персональных данных.<\/p>\n<p><b>5.2.<\/b> Обработка преимущественно автоматизированная. Отдельные операции поддержки и возвратов выполняются вручную.<\/p>\n<p><b>5.3.<\/b> Решения, порождающие юридические последствия для Пользователя или иным образом затрагивающие его права, не принимаются исключительно на основании автоматизированной обработки.<\/p>\n<h3 id=\"s6\">6. Источники данных<\/h3>\n<ul><li>непосредственно от Пользователя через Telegram, Мини-приложение и поддержку;<\/li><li>из доступной Боту части профиля Telegram;<\/li><li>от ООО НКО «ЮМани» (ЮKassa) — в объёме, необходимом для платежа, Подписки, чека и возврата;<\/li><li>автоматически — от программных средств Сервиса при действиях Пользователя.<\/li><\/ul>\n<h3 id=\"s7\">7. Мини-приложение, cookie и аналитика<\/h3>\n<p><b>7.1.<\/b> Мини-приложение может использовать локальное хранилище браузера и cookie, необходимые для его работы (например, для сохранения выбранной вкладки или темы).<\/p>\n<p><b>7.2.<\/b> Мини-приложение не использует сторонние системы веб-аналитики и рекламные трекеры.<\/p>\n<h3 id=\"s8\">8. Место и сроки хранения<\/h3>\n<p><b>8.1.<\/b> Запись, систематизация, накопление, хранение, уточнение и извлечение персональных данных граждан РФ осуществляются с использованием баз данных, находящихся на территории Российской Федерации (ч. 5 ст. 18 152-ФЗ).<\/p>\n<p><b>8.2.<\/b> Сроки хранения:<\/p>\n<div class=\"table\"><table><thead><tr><th>Данные<\/th><th>Срок<\/th><\/tr><\/thead><tbody><tr><td>Профиль, идентификаторы, группа, настройки<\/td><td>Пока Пользователь пользуется Сервисом и 3 года после последней активности, либо до подтверждённого требования об удалении<\/td><\/tr><tr><td>Технические журналы<\/td><td>До 90 календарных дней<\/td><\/tr><tr><td>Обращения в поддержку<\/td><td>3 года после закрытия обращения<\/td><\/tr><tr><td>Платежи, Подписки, возвраты, чеки<\/td><td>5 лет<\/td><\/tr><tr><td>Технические ответы ЮKassa, ошибки платежей<\/td><td>90 календарных дней<\/td><\/tr><tr><td>Сохранённый способ оплаты<\/td><td>До удаления Пользователем или отключения Автоплатежа<\/td><\/tr><tr><td>Записи о принятии документов и согласий<\/td><td>Срок действия Договора и 3 года после его прекращения<\/td><\/tr><tr><td>Согласие на рекламные сообщения<\/td><td>Пока согласие действует; запись о согласии и отзыве — 3 года после отзыва<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>8.3.<\/b> Данные, необходимые для исполнения закона или разрешения спора, могут храниться до окончания соответствующей обязанности или спора.<\/p>\n<p><b>8.4.<\/b> Резервные копии хранятся не более 30 календарных дней и перезаписываются по кругу. Удалённые данные исчезают из резервных копий по истечении этого срока.<\/p>\n<p><b>8.5.<\/b> По истечении сроков хранения данные уничтожаются или обезличиваются.<\/p>\n<h3 id=\"s9\">9. Передача данных<\/h3>\n<p><b>9.1.<\/b> Данные передаются или становятся доступны:<\/p>\n<ul><li><b>ООО НКО «ЮМани» (ЮKassa)<\/b> — для проведения платежей, сохранения способа оплаты, возвратов и выдачи чеков;<\/li><li><b>Telegram<\/b> — для приёма команд и доставки сообщений (раздел 10);<\/li><li><b>ООО «Админвпс» (ИНН 7708257630)<\/b> — провайдеру хостинга, предоставляющему серверы на территории РФ;<\/li><li><b>ФНС России<\/b> — в объёме, необходимом для формирования чеков по НПД (через приложение «Мой налог»; сведения о покупателе в чек не передаются — только наименование услуги, сумма и дата);<\/li><li><b>государственным органам<\/b> — в случаях и объёме, предусмотренных законодательством РФ.<\/li><\/ul>\n<p><b>9.2.<\/b> Лица, обрабатывающие данные по поручению Оператора, обязаны соблюдать конфиденциальность и требования 152-ФЗ к защите данных.<\/p>\n<h3 id=\"s10\">10. Трансграничная передача через Telegram<\/h3>\n<p><b>10.1.<\/b> Telegram — основная платформа Сервиса. Пользователь сам обращается к Боту через Telegram, и использование Telegram необходимо для заключения и исполнения Договора.<\/p>\n<p><b>10.2.<\/b> Через Telegram передаются Telegram ID, содержание команд, ответов и уведомлений, идентификаторы и время сообщений, статус доставки. Платёжные данные через Telegram не передаются, кроме тех, что Пользователь сам указывает в сообщениях.<\/p>\n<p><b>10.3.<\/b> Инфраструктура Telegram может находиться за пределами РФ. Оператор осуществляет трансграничную передачу в соответствии со ст. 12 152-ФЗ и учитывает решения Роскомнадзора о её ограничении или запрете.<\/p>\n<h3 id=\"s11\">11. Права Пользователя<\/h3>\n<p><b>11.1.<\/b> Пользователь вправе:<\/p>\n<ul><li>получить сведения об обработке своих данных;<\/li><li>потребовать уточнения, блокирования или уничтожения данных, если они неполные, устаревшие, неточные, незаконно получены или не нужны для заявленной цели;<\/li><li>отозвать согласие, если обработка основана на согласии;<\/li><li>обжаловать действия Оператора в Роскомнадзоре или в суде.<\/li><\/ul>\n<p><b>11.2.<\/b> Обращения принимаются через «Настройки → Поддержка», сообщением с Telegram-аккаунта Пользователя или на sgmurobot@yandex.ru.<\/p>\n<p><b>11.3.<\/b> Для защиты данных Оператор вправе попросить подтвердить связь заявителя с Telegram-аккаунтом или платежом.<\/p>\n<p><b>11.4.<\/b> Сроки:<\/p>\n<ul><li>ответ на запрос о составе и обработке данных — <b>10 рабочих дней<\/b> (может быть продлён не более чем на 5 рабочих дней с уведомлением о причинах);<\/li><li>уточнение данных — <b>7 рабочих дней<\/b>;<\/li><li>прекращение обработки и уничтожение — в сроки, установленные ст. 20 и 21 152-ФЗ.<\/li><\/ul>\n<p><b>11.5.<\/b> Удаление профиля означает прекращение доступа к Сервису. Данные о платежах хранятся в сроки из п. 8.2, поскольку этого требует закон.<\/p>\n<h3 id=\"s12\">12. Защита данных<\/h3>\n<p><b>12.1.<\/b> Оператор применяет правовые, организационные и технические меры: разграничение и контроль доступа, шифрование каналов связи (TLS/SSH), резервное копирование, своевременное обновление ПО, защиту сетевого периметра, журналирование доступа к инфраструктуре.<\/p>\n<p><b>12.2.<\/b> При выявлении неправомерной или случайной передачи (утечки) персональных данных Оператор устраняет её последствия и уведомляет Роскомнадзор: в течение <b>24 часов<\/b> — об инциденте, в течение <b>72 часов<\/b> — о результатах внутреннего расследования (ч. 3.1 ст. 21 152-ФЗ).<\/p>\n<h3 id=\"s13\">13. Несовершеннолетние<\/h3>\n<p><b>13.1.<\/b> Сервис предназначен для лиц <b>от 14 лет<\/b>. Если Оператору станет известно, что Сервисом пользуется лицо младше 14 лет, его данные будут удалены, а доступ прекращён.<\/p>\n<h3 id=\"s14\">14. Изменение Политики<\/h3>\n<p><b>14.1.<\/b> Оператор вправе обновлять Политику. Новая редакция публикуется в Боте (/docs) и по адресу https://rianbola.github.io/sgmu-docs/ с указанием даты вступления в силу. О существенных изменениях Пользователи уведомляются через Бот.<\/p>\n<h3 id=\"s15\">15. Связанные документы<\/h3>\n<ul><li>Публичная оферта<\/li><li>Об источнике и точности расписания<\/li><li>Правила допустимого использования<\/li><li>Правила возврата и отказа от услуг<\/li><\/ul>"}, {"id": "acceptable-use", "emoji": "⚖️", "title": "Правила допустимого использования", "menu_title": "Правила допустимого использования", "menu_note": "", "version": "2.0", "date": "08.11.2026", "summary": ["<b>Коротко.<\/b> Пользуйтесь ботом для себя и в рамках закона.", "<b>Можно.<\/b> Делиться расписанием своей группы с одногруппниками.", "<b>Нельзя.<\/b> Взлом, обход подписки и лимитов, парсинг, спам, перепродажа доступа, мультиаккаунты, накрутка рефералов и чужие промокоды.", "<b>Не выдавайте бота за вуз.<\/b> Сервис не связан с СГМУ.", "<b>Нарушения.<\/b> Предупреждение, ограничения или блокировка.", "<b>Не согласны?<\/b> Напишите в поддержку — разберёмся."], "toc": [["s1", "1. Область действия"], ["s2", "2. Общие требования"], ["s3", "3. Что разрешено"], ["s4", "4. Что запрещено"], ["s5", "5. Технические лимиты"], ["s6", "6. Меры при нарушениях"], ["s7", "7. Сообщения о нарушениях и обжалование"], ["s8", "8. Изменение Правил"]], "body": "<p><i>Редакция 2.0 от 08.11.2026. Документ является неотъемлемой частью Публичной оферты.<\/i><\/p>\n<h3 id=\"s1\">1. Область действия<\/h3>\n<p><b>1.1.<\/b> Правила определяют, как допустимо использовать Telegram-бот «Бот расписания СГМУ», его Мини-приложение и платную Подписку (далее — «Сервис»).<\/p>\n<p><b>1.2.<\/b> Правила обязательны для всех Пользователей. По вопросам возвратов применяются «Правила возврата и отказа от услуг», по вопросам данных — «Политика в отношении обработки персональных данных».<\/p>\n<h3 id=\"s2\">2. Общие требования<\/h3>\n<p><b>2.1.<\/b> Используйте Сервис законными способами, соблюдая законодательство РФ и правила Telegram.<\/p>\n<p><b>2.2.<\/b> Вы отвечаете за безопасность своего Telegram-аккаунта и за действия, совершённые с него.<\/p>\n<p><b>2.3.<\/b> Указывайте свои реальные курс и группу — от этого зависит, какое расписание вы увидите.<\/p>\n<h3 id=\"s3\">3. Что разрешено<\/h3>\n<p><b>3.1.<\/b> Пользоваться Сервисом для личных учебных целей.<\/p>\n<p><b>3.2.<\/b> Делиться расписанием своей группы с одногруппниками и знакомыми — скриншотом, пересылкой сообщения или реферальной ссылкой, — если это не носит коммерческий характер.<\/p>\n<p><b>3.3.<\/b> Сообщать об ошибках в расписании и уязвимостях Сервиса через поддержку.<\/p>\n<h3 id=\"s4\">4. Что запрещено<\/h3>\n<p><b>4.1. Взлом и вмешательство:<\/b> попытки несанкционированного доступа, сканирование уязвимостей без согласования с Исполнителем, эксплуатация ошибок, DoS/DDoS-атаки, вмешательство в работу серверов и сетей.<\/p>\n<p><b>4.2. Обход оплаты и ограничений:<\/b> обход Подписки, Пробного периода и лимитов; использование одной Подписки несколькими людьми; перепродажа, сдача в аренду или иная передача доступа за плату.<\/p>\n<p><b>4.3. Автоматизация и парсинг:<\/b> скрипты, боты, макросы, массовое извлечение данных и иные действия, создающие чрезмерную нагрузку, кроме прямо разрешённых в интерфейсе.<\/p>\n<p><b>4.4. Коммерческое распространение:<\/b> копирование базы расписаний и её публикация в других ботах, каналах, сайтах и приложениях, в том числе платных.<\/p>\n<p><b>4.5. Выдача Сервиса за официальный:<\/b> представление данных Сервиса как официального расписания СГМУ, использование Сервиса от имени Вуза.<\/p>\n<p><b>4.6. Злоупотребления:<\/b> спам, фишинг, рассылки через Сервис, оскорбления в адрес поддержки, отправка вредоносных файлов.<\/p>\n<p><b>4.7. Мошенничество с бонусами:<\/b> создание дополнительных аккаунтов для повторного Пробного периода или реферальных бонусов, использование и перепродажа чужих промокодов, получение промокодов обманом.<\/p>\n<p><b>4.8. Нарушение прав третьих лиц:<\/b> публикация чужих персональных данных, паролей, ключей и материалов, нарушающих авторские и иные права.<\/p>\n<h3 id=\"s5\">5. Технические лимиты<\/h3>\n<p><b>5.1.<\/b> Для стабильной работы в Сервисе действуют лимиты на количество запросов и уведомлений. Они не мешают обычному использованию и могут корректироваться.<\/p>\n<p><b>5.2.<\/b> Превышение лимитов может привести к временной задержке ответов.<\/p>\n<h3 id=\"s6\">6. Меры при нарушениях<\/h3>\n<p><b>6.1.<\/b> В зависимости от тяжести и повторяемости нарушения Исполнитель вправе:<\/p>\n<ul><li>направить предупреждение;<\/li><li>временно ограничить отдельные функции;<\/li><li>заблокировать аккаунт на срок до 90 календарных дней;<\/li><li>заблокировать аккаунт бессрочно;<\/li><li>аннулировать промокоды, реферальные и бонусные дни, полученные с нарушением.<\/li><\/ul>\n<p><b>6.2.<\/b> За грубое или повторное нарушение Исполнитель вправе в одностороннем порядке отказаться от Договора (п. 12.2 Оферты).<\/p>\n<p><b>6.3.<\/b> Меры не ограничивают законные права Пользователя. При прекращении Договора сумма возврата определяется по «Правилам возврата и отказа от услуг».<\/p>\n<p><b>6.4.<\/b> О применении мер (кроме случаев атак на инфраструктуру) Пользователь уведомляется через Бот с указанием причины.<\/p>\n<h3 id=\"s7\">7. Сообщения о нарушениях и обжалование<\/h3>\n<p><b>7.1.<\/b> Сообщить о нарушении или уязвимости можно через «⚙️ Настройки» → «🆘 Написать в поддержку» или на sgmurobot@yandex.ru. Добросовестное сообщение об уязвимости без причинения вреда не считается нарушением.<\/p>\n<p><b>7.2.<\/b> Обжаловать меры можно теми же каналами. Срок ответа — до 10 календарных дней. Если мера применена по ошибке, она отменяется, а срок Подписки продлевается на время ограничения.<\/p>\n<h3 id=\"s8\">8. Изменение Правил<\/h3>\n<p><b>8.1.<\/b> Правила могут обновляться; новая редакция публикуется в Боте по команде /docs с указанием даты. Существенные изменения не ухудшают положение добросовестных Пользователей в течение оплаченного периода.<\/p>"}, {"id": "refund", "emoji": "💸", "title": "Правила возврата и отказа от услуг", "menu_title": "Правила возврата", "menu_note": "", "version": "2.0", "date": "08.11.2026", "summary": ["<b>Передумали в день оплаты<\/b> — вернём 100%.", "<b>Период ещё не начался<\/b> — вернём 100%.", "<b>Период идёт<\/b> — вернём за неиспользованные дни.", "<b>Комиссии<\/b> платёжных систем с вас не удерживаем.", "<b>Срок<\/b> — решение до 10 дней, деньги — тем же способом, которым платили.", "<b>Не возвращаются<\/b> пробный период, бонусные и промо-дни.", "<b>Как вернуть:<\/b> «Настройки → Поддержка» или sgmurobot@yandex.ru."], "toc": [["s1", "1. Общие положения"], ["s2", "2. Право на отказ"], ["s3", "3. Размер возврата"], ["s4", "4. Что не возвращается"], ["s5", "5. Ошибки в расписании"], ["s6", "6. Как запросить возврат"], ["s7", "7. Сроки и способ возврата"], ["s8", "8. Спорные платежи"], ["s9", "9. Изменение Правил"]], "body": "<p><i>Редакция 2.0 от 08.11.2026. Документ является неотъемлемой частью Публичной оферты.<\/i><\/p>\n<h3 id=\"s1\">1. Общие положения<\/h3>\n<p><b>1.1.<\/b> Правила определяют порядок отказа Пользователя от услуг и возврата денег за Подписку на Telegram-бот «Бот расписания СГМУ».<\/p>\n<p><b>1.2.<\/b> Исполнитель: Баталин Ярослав Леонидович, самозанятый (НПД), ИНН 583408943837, г. Санкт-Петербург. Контакт: sgmurobot@yandex.ru.<\/p>\n<h3 id=\"s2\">2. Право на отказ<\/h3>\n<p><b>2.1.<\/b> Пользователь вправе в любой момент отказаться от Договора и прекратить Подписку (ст. 32 Закона РФ «О защите прав потребителей», ст. 782 ГК РФ).<\/p>\n<p><b>2.2.<\/b> Комиссии платёжных систем и эквайринга с Пользователя <b>не удерживаются<\/b>.<\/p>\n<h3 id=\"s3\">3. Размер возврата<\/h3>\n<div class=\"table\"><table><thead><tr><th>Ситуация<\/th><th>Возврат<\/th><\/tr><\/thead><tbody><tr><td>Запрос в день оплаты<\/td><td><b>100%<\/b> — платёж отменяется, если это технически возможно у ЮKassa; иначе — полный возврат<\/td><\/tr><tr><td>Оплаченный период ещё не начался (например, Подписка куплена заранее при действующей)<\/td><td><b>100%<\/b> за не начавшийся период<\/td><\/tr><tr><td>Оплаченный период идёт<\/td><td><b>Пропорционально<\/b> неиспользованным дням (п. 3.1)<\/td><\/tr><tr><td>Списание по Автоплатежу, после которого Пользователь не пользовался Сервисом, при запросе в течение 3 календарных дней<\/td><td><b>100%<\/b><\/td><\/tr><tr><td>Исполнитель прекратил работу Сервиса или источник расписания стал недоступен<\/td><td>За неиспользованные дни или, по выбору Пользователя, продление Подписки<\/td><\/tr><tr><td>Договор прекращён из-за нарушения Пользователем «Правил допустимого использования»<\/td><td>За неиспользованные дни<\/td><\/tr><tr><td>Оплаченный период закончился<\/td><td>Возврат не производится<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>3.1. Расчёт пропорционального возврата:<\/b><\/p>\n<blockquote>Сумма возврата = Оплаченная сумма × Неиспользованные дни ÷ Количество дней оплаченного периода<\/blockquote>\n<ul><li>День подачи запроса считается использованным.<\/li><li>Учитываются только дни оплаченного периода; бонусные, реферальные и промо-дни в расчёт не входят.<\/li><li>Сумма округляется до копейки в пользу Пользователя.<\/li><\/ul>\n<p><b>Пример.<\/b> Подписка на 3 месяца (90 дней) за 199 ₽, запрос подан на 31-й день. Неиспользованных дней — 59. Возврат: 199 × 59 ÷ 90 = 130,46 ₽.<\/p>\n<h3 id=\"s4\">4. Что не возвращается<\/h3>\n<p><b>4.1.<\/b> Пробный период бесплатен, денежные средства за него не начисляются и не возвращаются.<\/p>\n<p><b>4.2.<\/b> Дни, полученные по промокоду, реферальной программе или в качестве бонуса, денежному возврату не подлежат.<\/p>\n<h3 id=\"s5\">5. Ошибки в расписании<\/h3>\n<p><b>5.1.<\/b> Возможность неточностей в расписании прямо описана в документе «Об источнике и точности расписания» и не является недостатком услуги.<\/p>\n<p><b>5.2.<\/b> Если Пользователь недоволен точностью данных, он вправе в любой момент отказаться от Подписки и получить возврат за неиспользованные дни по п. 3.1.<\/p>\n<h3 id=\"s6\">6. Как запросить возврат<\/h3>\n<p><b>6.1.<\/b> Напишите в «⚙️ Настройки» → «🆘 Написать в поддержку» или на sgmurobot@yandex.ru. Укажите дату и сумму платежа (или приложите чек).<\/p>\n<p><b>6.2.<\/b> Для защиты средств Исполнитель вправе попросить подтвердить связь заявителя с платежом и Telegram-аккаунтом.<\/p>\n<p><b>6.3.<\/b> При возврате Подписка прекращается, а Автоплатёж отключается.<\/p>\n<h3 id=\"s7\">7. Сроки и способ возврата<\/h3>\n<p><b>7.1.<\/b> Решение по запросу принимается в течение <b>10 календарных дней<\/b> с момента получения запроса и необходимых сведений.<\/p>\n<p><b>7.2.<\/b> Деньги возвращаются тем же способом, которым производилась оплата. Срок зачисления зависит от банка и платёжной системы и обычно составляет до 30 календарных дней.<\/p>\n<p><b>7.3.<\/b> При возврате формируется чек коррекции (аннулирования) в соответствии с правилами НПД.<\/p>\n<h3 id=\"s8\">8. Спорные платежи<\/h3>\n<p><b>8.1.<\/b> Перед оспариванием платежа в банке (chargeback) рекомендуем обратиться в поддержку — так возврат пройдёт быстрее. Это право, а не обязанность Пользователя.<\/p>\n<h3 id=\"s9\">9. Изменение Правил<\/h3>\n<p><b>9.1.<\/b> Правила могут обновляться; новая редакция публикуется в Боте по команде /docs с указанием даты. Изменения не ухудшают условия возврата по уже оплаченным периодам.<\/p>"}];
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const home = document.getElementById('home');
const view = document.getElementById('doc');

DOCS.forEach((d, i) => {
  const b = document.createElement('button');
  b.className = 'item' + (i === 0 ? ' accent' : '');
  b.innerHTML = '<span class="emoji"></span><span><span class="t"></span><span class="note"></span></span>';
  b.querySelector('.emoji').textContent = d.emoji;
  b.querySelector('.t').textContent = d.menu_title;
  b.querySelector('.note').textContent = d.menu_note || '';
  b.addEventListener('click', () => openDoc(d.id, true));
  document.getElementById('list').appendChild(b);
});

function openDoc(id, push) {
  const d = DOCS.find(x => x.id === id);
  if (!d) return;
  document.getElementById('d-title').textContent = d.emoji + ' ' + d.title;
  document.getElementById('d-meta').textContent = 'Редакция ' + d.version + ' от ' + d.date;
  document.getElementById('d-summary').innerHTML = d.summary.map(s => '<p>' + s + '</p>').join('');
  document.getElementById('d-toc').innerHTML = d.toc.map(t => '<a href="#' + t[0] + '">' + t[1] + '</a>').join('');
  document.getElementById('d-body').innerHTML = d.body;
  view.classList.toggle('accent', DOCS[0].id === d.id);
  home.hidden = true;
  view.hidden = false;
  window.scrollTo(0, 0);
  if (push) history.pushState({ doc: id }, '', '?doc=' + encodeURIComponent(id));
  if (inTg) { tg.BackButton.show(); tg.MainButton.hide(); }
}

function showHome() {
  view.hidden = true;
  home.hidden = false;
  if (inTg) { tg.BackButton.hide(); tg.MainButton.show(); }
}

document.getElementById('back').addEventListener('click', () => history.back());
window.addEventListener('popstate', e => (e.state && e.state.doc) ? openDoc(e.state.doc, false) : showHome());
document.getElementById('d-toc').addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  document.getElementById(a.getAttribute('href').slice(1)).scrollIntoView({ behavior: 'smooth' });
});

if (inTg) {
  document.body.classList.add('tg');
  tg.ready();
  tg.expand();
  tg.BackButton.onClick(() => history.back());
  tg.MainButton.setText('Закрыть');
  tg.MainButton.onClick(() => tg.close());
  tg.MainButton.show();
}
const start = new URLSearchParams(location.search).get('doc');
if (start) { history.replaceState({ doc: start }, '', location.href); openDoc(start, false); }
</script>
